name: udham
description: UdhaM - shared expense ledger (local-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local persistence (offline-first)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  crypto: ^3.0.3
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  sqlite3: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
