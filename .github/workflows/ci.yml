name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool/
          key: flutter-packages-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-packages-${{ runner.os }}-

      - run: flutter pub get

      - name: Run flutter analysis
        run: flutter analyze

      - name: Run flutter test
        run: flutter test

      - name: Build release APK (unsigned)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/udham.keystore
          else
            keytool -keystore android/udham.keystore -alias androiddebugkey -importcert -noprompt -destkeystore android/udham.keystore -storepass android -keypass android <<EOF 2>/dev/null || true
EOF
          fi
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --dart-define "SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            --dart-define "SUPABASE_REDIRECT_URL=${SUPABASE_REDIRECT_URL}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: udham-release-unsigned
          path: build/app/outputs/flutter-apk/**/app-release.apk