name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool/
          key: flutter-packages-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-packages-${{ runner.os }}-

      - run: flutter pub get

      - name: Decode and save Keystore to runner temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/udham.keystore

      - name: Set ANDROID_KEYSTORE_PATH for Gradle
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/udham.keystore" >> $GITHUB_ENV

      - name: Build release APK (signed, production)
        env:
          ANDROID_KEYSTORE_PATH: $ANDROID_KEYSTORE_PATH
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL }}
        run: |
          flutter build apk --release \
            --dart-define "SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            --dart-define "SUPABASE_REDIRECT_URL=${SUPABASE_REDIRECT_URL}" \
            --define udhamProductionRelease=true \
            --target-platform=android-arm64

      - name: Verify APK signature
        run: |
          apksigner verify --print-certs build/app/outputs/flutter-apk/**/app-release.apk

      - name: Verify Supabase URL in APK
        run: |
          if strings build/app/outputs/flutter-apk/**/app-release.apk | grep -q "xpodixygnzziczrdwpyd.supabase.co"; then
            echo "✅ Supabase URL found in APK"
          else
            echo "❌ Supabase URL missing from APK – failing workflow"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unfound_tag: false
          files: |
            build/app/outputs/flutter-apk/**/app-release.apk

      - name: Remove temporary keystore
        run: rm -f $RUNNER_TEMP/udham.keystore