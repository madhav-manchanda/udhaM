name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool/
          key: flutter-packages-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-packages-${{ runner.os }}-

      - run: flutter pub get

      - name: Parse tag version and update local.properties
        id: parse_version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "version_name=$VERSION" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "major=$MAJOR" >> $GITHUB_ENV
          echo "minor=$MINOR" >> $GITHUB_ENV
          echo "patch=$PATCH" >> $GITHUB_ENV

      - name: Apply version to local.properties
        run: |
          cat > android/local.properties <<EOF
flutter.sdk=/home/madhav/flutter
sdk.dir=/home/madhav/Android/Sdk
flutter.buildMode=release
flutter.versionName=${{ env.version_name }}
flutter.versionCode=${{ env.version_code }}
EOF

      - name: Decode and save Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/udham.keystore

      - name: Build release APK (signed)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --dart-define SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define SUPABASE_REDIRECT_URL=${{ secrets.SUPABASE_REDIRECT_URL }}

      - name: Verify Supabase URL in APK
        run: |
          if strings build/app/outputs/flutter-apk/**/app-release.apk | grep -q "xpodixygnzziczrdwpyd.supabase.co"; then
            echo "✅ Supabase URL found in APK"
          else
            echo "❌ Supabase URL missing from APK – failing workflow"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unfound_tag: false
          files: |
            build/app/outputs/flutter-apk/**/app-release.apk

      - name: Remove temporary keystore
        run: rm -f android/udham.keystore